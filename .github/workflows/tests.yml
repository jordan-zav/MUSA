name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install display runtime
        run: sudo apt-get update && sudo apt-get install --yes xvfb python3-tk

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint source and tests
        run: python -m ruff check src tests

      - name: Run tests with a virtual display
        run: xvfb-run --auto-servernum python -B -m pytest
