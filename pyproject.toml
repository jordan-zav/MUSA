[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musa-multifractal"
version = "0.1.0"
description = "MUSA: Multifractal Spectrum Analyzer for spatial and GIS-ready data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GNU GPLv3" }
authors = [{ name = "MUSA Contributors" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
gis = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
]

[project.scripts]
musa-ui = "musa.interface:launch_interface"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
