[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "musa-multifractal"
version = "1.1.0rc3"
description = "MUSA: QGIS workbench and shared Python core for multifractal and structural analysis."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "MUSA Contributors" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/jordan-zav/MUSA"
Repository = "https://github.com/jordan-zav/MUSA"
Documentation = "https://github.com/jordan-zav/MUSA/blob/main/docs/README.md"
Issues = "https://github.com/jordan-zav/MUSA/issues"

[project.optional-dependencies]
fast = ["numba>=0.64"]
gis = [
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
]
benchmarks = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.7",
  "pillow>=9.0",
  "requests>=2.31",
  "pymupdf>=1.24",
]

[project.scripts]
musa-ui = "musa.interface:launch_interface"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musa = ["assets/*.png", "assets/styles/*.qml"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/musa/interface.py" = ["E402"]
